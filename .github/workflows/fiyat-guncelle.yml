name: Fiyat, kur ve Yİ-ÜFE güncelle

on:
  schedule:
    - cron: '17 6 * * *'   # her gün 09:17 (Türkiye saati)
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sigara zamlarını tara
        continue-on-error: true
        run: node scripts/fiyat-guncelle.mjs
      - name: Dolar kuru ve Yİ-ÜFE
        continue-on-error: true
        run: node scripts/veri-guncelle.mjs
      - name: Değişiklik varsa kaydet
        run: |
          if [ -z "$(git status --porcelain fiyatlar.json kur.json yiufe.json yatirim.json)" ]; then echo "Değişiklik yok."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fiyatlar.json kur.json yiufe.json yatirim.json
          git commit -m "Otomatik veri güncellemesi: $(date -u +%F)"
          git push
