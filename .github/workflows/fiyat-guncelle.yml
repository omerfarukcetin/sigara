name: Sigara fiyatlarını güncelle

on:
  schedule:
    - cron: '17 6 * * *'   # her gün 09:17 (Türkiye saati)
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: tara
        run: node scripts/fiyat-guncelle.mjs
      - name: Değişiklik varsa kaydet
        if: steps.tara.outputs.mesaj != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fiyatlar.json
          git commit -m "${{ steps.tara.outputs.mesaj }}"
          git push
